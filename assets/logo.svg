<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle shadow/glow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <!-- Sleek Modern Gradients -->
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="gradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="innerCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <g filter="url(#shadow)">
    <!-- Outer Background Shape -->
    <rect width="512" height="512" rx="128" fill="#0b0f19"/>
    <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- Minimalist Chromium Aperture Wings -->
    <!-- Wing 1: Top Cyan/Blue -->
    <path d="M 256 96 
             A 160 160 0 0 1 394 176 
             L 288 238 
             A 64 64 0 0 0 256 232 
             A 64 64 0 0 0 200 264 
             L 145 168 
             A 160 160 0 0 1 256 96 Z" 
          fill="url(#gradTop)"/>

    <!-- Wing 2: Right Violet/Indigo -->
    <path d="M 394 176 
             A 160 160 0 0 1 346 394 
             L 256 320 
             A 64 64 0 0 0 288 288 
             A 64 64 0 0 0 288 238 
             L 394 176 Z" 
          fill="url(#gradRight)"/>

    <!-- Wing 3: Bottom Pink/Purple -->
    <path d="M 346 394 
             A 160 160 0 0 1 118 320 
             L 200 264 
             A 64 64 0 0 0 224 312 
             A 64 64 0 0 0 256 320 
             L 346 394 Z" 
          fill="url(#gradBottom)"/>

    <!-- Wing 4: Left Teal Connector to Close Minimalist Loop -->
    <path d="M 118 320 
             A 160 160 0 0 1 145 168 
             L 200 264 
             L 118 320 Z" 
          fill="url(#gradTop)" 
          opacity="0.95"/>

    <!-- Center White Ring & Minimalist Core -->
    <circle cx="256" cy="256" r="68" fill="#0b0f19"/>
    <circle cx="256" cy="256" r="60" fill="url(#coreGrad)"/>
    <circle cx="256" cy="256" r="44" fill="url(#innerCoreGrad)"/>

    <!-- Clean Central Minimalist Spark -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
