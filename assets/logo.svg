<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#1a153a"/>
      <stop offset="100%" stop-color="#0b0914"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Lightning / Speed Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Privacy Shield Shape -->
  <path d="M 256 64 
           C 340 100, 410 110, 420 120
           C 420 280, 360 380, 256 448
           C 152 380, 92 280, 92 120
           C 102 110, 172 100, 256 64 Z"
        fill="#131127" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Atomic Orbit 1 (Thorium symbol) -->
  <ellipse cx="256" cy="245" rx="140" ry="52" fill="none" stroke="#a855f7" stroke-width="5" stroke-dasharray="14 10" transform="rotate(-30 256 245)" opacity="0.6"/>
  
  <!-- Atomic Orbit 2 -->
  <ellipse cx="256" cy="245" rx="140" ry="52" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="14 10" transform="rotate(30 256 245)" opacity="0.6"/>

  <!-- Thorium Speed Lightning Bolt -->
  <polygon points="275,125 185,255 250,255 225,375 335,235 270,235" 
           fill="url(#lightningGrad)" 
           filter="url(#glow)"/>

  <!-- Small Glowing Core Node -->
  <circle cx="256" cy="245" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>
