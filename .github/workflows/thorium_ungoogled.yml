name: Build Thorium + Ungoogled

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'linux-arm64'
        type: choice
        options:
          - linux-arm64
          - windows-x64
          - all
  push:
    paths:
      - 'build_thorium_ungoogled.py'
      - '.github/workflows/thorium_ungoogled.yml'

jobs:
  build-linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux-arm64' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 64
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Run Build Script
        run: python build_thorium_ungoogled.py --target-os linux --target-cpu arm64 --src-dir src
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thorium-Ungoogled-Linux-arm64
          path: src/src/out/Thorium_arm64/*.AppImage

  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-x64' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Windows)
        shell: pwsh
        run: |
          Get-PSDrive
          if (Test-Path "C:\hostedtoolcache\windows") {
            Get-ChildItem "C:\hostedtoolcache\windows" | Where-Object { $_.Name -notin @("Python", "sccache") } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-PSDrive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Run Build Script
        run: python build_thorium_ungoogled.py --target-os win --target-cpu x64 --src-dir C:\src
        env:
          SCCACHE_GHA_ENABLED: "true"
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thorium-Ungoogled-Win-x64
          path: C:\src\src\out\Thorium_x64\mini_installer.exe
